            const maxTotal = isFoundation ? 55 : 50;

                if (selections.readingFluency !== null) fb.push(currentRubrics.readingFluency.items[selections.readingFluency].feedback);
                return fb.join(" ");
            }, [selections, currentRubrics]);

                let fb = [];
                if (selections.convResponse !== null) fb.push(currentRubrics.convResponse.items[selections.convResponse].feedback);
                if (selections.convLanguage !== null) fb.push(currentRubrics.convLanguage.items[selections.convLanguage].feedback);
                return fb.join(" ");
            }, [selections, currentRubrics]);

                let parts = [];
                if (generatedReadingFeedback) parts.push(`【Bacaan Lantang】\n${generatedReadingFeedback}`);
                if (generatedConvFeedback) parts.push(`【Perbualan】\n${generatedConvFeedback}`);
                return parts.join("\n\n");
            }, [generatedReadingFeedback, generatedConvFeedback]);

            useEffect(() => {
                setFeedbackText((currentText) => {
                    if (!currentText || currentText === lastAutoText) {
                        return generatedFeedback;
                    }
                    if (lastAutoText && currentText.includes(lastAutoText)) {
                        return currentText.replace(lastAutoText, generatedFeedback);
                    }
                    return generatedFeedback;
                });
                setLastAutoText(generatedFeedback);
            }, [generatedFeedback]);

                if (newSyllabus === syllabus) return;

                    setSyllabus(newSyllabus);
                    clearScores();
                    setStudent({ class: '', name: '', mtl: '' });
                };

                        title: 'Tukar Rubrik Penilaian',
                        message: 'Tukar kategori penilaian akan mengosongkan markah dan maklum balas semasa. Adakah anda ingin meneruskan?',

                        onConfirm: switchAction
                    });

                }

                setScores(prev => ({ ...prev, [category]: selectedScore }));
            };

                staging.style.top = '0';

                staging.style.background = '#ffffff';
                staging.style.zIndex = '-9999';

                clone.style.boxSizing = 'border-box';
                clone.style.width = '100%';
                clone.style.margin = '0';
                clone.style.padding = '38px';
                clone.style.background = '#ffffff';
                clone.style.border = '2px solid #3b82f6';
                clone.style.borderRadius = '16px';
                staging.appendChild(clone);
                document.body.appendChild(staging);

                    const options = {
                        margin: [8, 8, 8, 8],
                        filename: fileName,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                    };

                        isOpen: true,
                        title: 'PDF berjaya dijana',
                        message: `Fail: ${fileName}\n\nJika Chrome tidak bertanya lokasi simpanan, aktifkan “Ask where to save each file before downloading” dalam Chrome Settings > Downloads, kemudian klik “Simpan PDF” sekali lagi.`,
                        type: 'alert'
                    });
                } catch (error) {
                    console.error('PDF generation failed:', error);
                    setDialog({
                        isOpen: true,
                        title: 'Gagal menyimpan',
                        message: `PDF tidak dapat dijana. Sila muat semula halaman dan cuba lagi.\n\nMaklumat teknikal: ${error && error.message ? error.message : 'Unknown error'}`,
                        type: 'alert'
                    });
                } finally {
                    staging.remove();
                }
            };

            const availableClasses = useMemo(() => {
                const classes = new Set(roster.filter(s => s.subjectType === syllabus).map(s => s.class));
                return Array.from(classes).sort();
            }, [roster, syllabus]);

            const filteredStudents = useMemo(() => {
                if (!student.class) return [];
                return roster.filter(s => s.subjectType === syllabus && s.class === student.class);
            }, [roster, syllabus, student.class]);

            const handleClassChange = (e) => {
                const newClass = e.target.value;
                setStudent({ class: newClass, name: '', mtl: '' });
            };

            const handleStudentSelect = (e) => {
                const selectedName = e.target.value;
                const found = roster.find(s => s.name === selectedName && s.class === student.class && s.subjectType === syllabus);
                if (found) {
                    setStudent(found);
                } else {
                    setStudent({ ...student, name: selectedName, mtl: '' });
                }
            };

            const handleSubmitGAS = async () => {
                if (!student.name || !currentExaminer) {
                    setDialog({ isOpen: true, title: 'Peringatan', message: 'Sila pastikan nama murid telah dipilih dan Guru Penguji Lisan telah ditetapkan.', type: 'alert' });
                    return;
                }

                setSubmitStatus('loading');
                
                const payload = {
                    className: student.class,
                    indexNo: '',
                    studentName: student.name,
                    examiner: currentExaminer,
                    mtl: student.mtl,
                    syllabus: syllabus === 'standard' ? 'Bahasa Melayu Standard' : 'Bahasa Melayu Asas',
                    
                    // 4 Individual Sub-component Scores
                    readingPronScore: scores.readingPron,       // Sebutan & Kejelasan
                    readingFluencyScore: scores.readingFluency,   // Kelancaran & Gaya
                    readingCombinedScore: readingCombined,       // Bacaan Subtotal (/15 for Foundation, /20 for Standard)
                    
                    convResponseScore: scores.convResponse,       // Respons Peribadi & Pengembangan Idea
                    convLanguageScore: scores.convLanguage,       // Penggunaan Bahasa & Kelancaran
                    convCombinedScore: convTotal,                 // Perbualan Subtotal (/40 for Foundation, /30 for Standard)
                    
                    totalScore: grandTotal,                       // Jumlah Markah (/55 for Foundation, /50 for Standard)
                    maxTotal: maxTotal,
                    feedback: feedbackText,
                    timestamp: new Date().toLocaleString('en-SG', { hour12: false })
                };

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    setSubmitStatus('idle');
                    setDialog({ 
                        isOpen: true, 
                        title: '✅ Penghantaran Berjaya!', 
                        message: `Markah untuk ${student.name} telah berjaya disimpan ke pangkalan data awan (cloud).`, 
                        type: 'alert',
                        isSuccess: true 
                    });
                } catch (error) {
                    setSubmitStatus('idle');
                    setDialog({ isOpen: true, title: 'Penghantaran Gagal', message: 'Ralat rangkaian, sila cuba lagi.', type: 'alert' });
                }
            };

            const resetForm = () => {
                setDialog({
                    isOpen: true,
                    title: 'Sahkan Kosongkan Borang',
                    message: 'Adakah anda pasti mahu mengosongkan markah semasa untuk menilai murid seterusnya?',
                    type: 'confirm',
                    onConfirm: () => {
                        setStudent(prev => ({ ...prev, name: '', mtl: '' }));
                        clearScores();
                    }
                });
            }

            const renderRubricRow = (categoryKey, rubricObj) => (
                <div className="mb-10 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 className="font-bold text-xl md:text-2xl text-slate-800">
                            {rubricObj.title} <span className="text-slate-400 text-lg font-medium">({rubricObj.max} markah)</span>
                        </h3>
                        <div className="flex items-center space-x-3 bg-blue-50 px-4 py-2 rounded-xl border border-blue-200 w-full md:w-auto justify-between md:justify-start">
                            <span className="text-base md:text-lg text-blue-900 font-bold">Markah:</span>
                            <div className="flex items-baseline">
                                <input 
                                    type="number" 
                                    min="0" max={rubricObj.max}
                                    value={scores[categoryKey]} 
                                    onChange={(e) => handleScoreChange(categoryKey, e.target.value)}
                                    className="w-16 text-center font-black text-2xl text-blue-700 bg-transparent border-b-2 border-blue-300 focus:outline-none focus:border-blue-700 transition-colors"
                                />
                                <span className="text-slate-500 font-medium ml-1">/{rubricObj.max}</span>
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        {rubricObj.items.map((item, index) => {
                            const isSelected = selections[categoryKey] === index;
                            return (
                                <div 
                                    key={index}
                                    onClick={() => handleSelect(categoryKey, index, item.scores[item.scores.length - 1])}
                                    className={`cursor-pointer rounded-xl p-4 transition-all duration-200 border-2 flex flex-col ${
                                        isSelected 
                                        ? 'border-blue-600 bg-blue-50 shadow-md ring-4 ring-blue-100 scale-[1.02]' 
                                        : 'border-slate-200 hover:border-blue-400 hover:bg-slate-50'
                                    }`}
                                >
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {item.scores.map(s => (
                                            <button
                                                key={s}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    handleSelect(categoryKey, index, s);
                                                }}
                                                className={`w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center text-sm md:text-base font-black transition-all ${
                                                    isSelected && scores[categoryKey] === s 
                                                    ? 'bg-blue-600 text-white shadow-lg scale-110' 
                                                    : 'bg-white border-2 border-slate-300 text-slate-600 hover:bg-blue-100 hover:text-blue-800 hover:border-blue-400'
                                                }`}
                                            >
                                                {s}
                                            </button>
                                        ))}
                                    </div>
                                    <div className={`font-bold text-lg mb-2 ${isSelected ? 'text-blue-800' : 'text-slate-700'}`}>
                                        {item.label}
                                    </div>
                                    <div className={`text-sm leading-relaxed flex-grow ${isSelected ? 'text-blue-900/80 font-medium' : 'text-slate-500'}`}>
                                        {item.desc}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
                    
                    {/* Modal Dialogs */}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4 no-print">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all border border-slate-200">
                                <div className={`p-10 ${dialog.isSuccess ? 'bg-green-50 text-center' : ''}`}>
                                    {dialog.isSuccess && <div className="text-7xl mb-6">🎉</div>}
                                    <h3 className={`font-black text-3xl mb-4 ${dialog.isSuccess ? 'text-green-800' : 'text-slate-900'}`}>
                                        {dialog.title || 'Peringatan'}
                                    </h3>
                                    <p className={`leading-relaxed text-xl ${dialog.isSuccess ? 'text-green-900 font-medium' : 'text-slate-600'}`}>
                                        {dialog.message}
                                    </p>
                                </div>
                                <div className="p-6 bg-slate-50 border-t border-slate-100 flex justify-center space-x-4">
                                    {dialog.type === 'confirm' && (
                                        <button 
                                            onClick={() => setDialog({ ...dialog, isOpen: false })} 
                                            className="px-8 py-4 text-slate-600 font-bold text-lg hover:bg-slate-200 rounded-xl transition-colors w-full"
                                        >
                                            Batal
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => { 
                                            if(dialog.onConfirm) dialog.onConfirm(); 
                                            setDialog({ ...dialog, isOpen: false, isSuccess: false }); 
                                        }} 
                                        className={`px-8 py-4 text-white font-black text-lg rounded-xl shadow-lg transition-colors w-full ${dialog.isSuccess ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        Faham
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Navigasi Atas & Bar Maklumat */}
                    <div className="sticky top-0 z-10 bg-white/95 backdrop-blur-xl shadow-md border-b border-slate-200 rounded-b-3xl p-4 lg:p-5 mb-8 flex flex-col xl:flex-row justify-between items-start xl:items-center no-print gap-4 transition-all">
                        
                        <div className="flex flex-col space-y-4 w-full xl:w-auto">
                            {/* Tajuk Aplikasi & Pilihan Kurikulum */}
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                <span className="text-2xl font-black bg-gradient-to-r from-blue-700 to-indigo-700 bg-clip-text text-transparent drop-shadow-sm whitespace-nowrap">Alexandra Pemarkahan Lisan Bahasa Melayu Darjah 5 (2026)</span>
                                
                                <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                                    <button
                                        onClick={() => handleSyllabusChange('standard')}
                                        className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${syllabus === 'standard' ? 'bg-slate-100 text-blue-700 shadow-inner' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        Standard
                                    </button>
                                    <button
                                        onClick={() => handleSyllabusChange('foundation')}
                                        className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${syllabus === 'foundation' ? 'bg-slate-100 text-emerald-700 shadow-inner' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        Asas
                                    </button>
                                </div>
                            </div>

                            {/* Pilihan Murid & Guru Penguji */}
                            <div className="flex flex-wrap items-center gap-3">
                                <select 
                                    value={student.class} 
                                    onChange={handleClassChange}
                                    className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm"
                                >
                                    <option value="">- Pilih Kelas -</option>
                                    {availableClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                
                                <select 
                                    value={student.name} 
                                    onChange={handleStudentSelect}
                                    disabled={!student.class}
                                    className="w-40 md:w-56 border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-blue-700 shadow-sm cursor-pointer disabled:bg-slate-100 disabled:cursor-not-allowed"
                                >
                                    <option value="">- Pilih Murid -</option>
                                    {filteredStudents.map((s, i) => <option key={i} value={s.name}>{s.name}</option>)}
                                </select>

                                <div className="flex items-center space-x-2 md:border-l-2 md:border-slate-200 md:pl-4">
                                    <select 
                                        value={currentExaminer}
                                        onChange={handleExaminerChange}
                                        className="border-2 border-purple-200 rounded-xl px-3 py-2 bg-purple-50 focus:ring-4 focus:ring-purple-500/20 outline-none font-bold text-purple-800 shadow-sm cursor-pointer"
                                    >
                                        <option value="">- Guru Penguji -</option>
                                        {examinersList.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                                
                                {student.mtl && (
                                    <span className="bg-white text-slate-600 text-xs px-2 py-1 rounded-md border border-slate-200 font-bold shadow-sm">
                                        MTL: {student.mtl}
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* Ringkasan Markah Langsung */}
                        <div className="flex items-center justify-end space-x-4 md:space-x-6 w-full xl:w-auto bg-white/50 xl:bg-transparent p-3 xl:p-0 rounded-2xl xl:rounded-none">
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">Subtotal Bacaan</div>
                                <div className="font-black text-xl text-indigo-600">{readingCombined}<span className="text-sm text-slate-400 font-medium">/{maxReading}</span></div>
                            </div>
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">Subtotal Perbualan</div>
                                <div className="font-black text-xl text-indigo-600">{convTotal}<span className="text-sm text-slate-400 font-medium">/{maxConv}</span></div>
                            </div>
                            <div className={`text-center px-6 py-2 rounded-2xl shadow-md transition-colors ${syllabus === 'foundation' ? 'bg-emerald-600' : 'bg-blue-600'} text-white`}>
                                <div className="text-xs font-bold opacity-90 mb-1">Jumlah Markah</div>
                                <div className="font-black text-3xl leading-none">{grandTotal}<span className="text-sm font-medium opacity-80 ml-1">/{maxTotal}</span></div>
                            </div>
                        </div>
                    </div>

                    {/* Paparan Cetak Sahaja */}
                    <div className="print-only print-container">
                        <div className="text-center mb-6 border-b-2 border-slate-200 pb-6">
                            <h1 className="text-3xl font-black text-slate-900 mb-2 tracking-wide">🌟 Borang Maklum Balas Lisan Bahasa Melayu 🌟</h1>
                            <p className="text-slate-500 mb-4 text-lg">({syllabus === 'standard' ? 'Bahasa Melayu Standard' : 'Bahasa Melayu Asas'})</p>
                            <div className="flex justify-center flex-wrap gap-6 text-lg text-slate-700 font-medium">
                                <span>Kelas: <strong className="text-slate-900 font-black">{student.class || "Tiada"}</strong></span>
                                <span>Nama: <strong className="text-slate-900 font-black">{student.name || "Tiada Nama"}</strong></span>
                            </div>
                        </div>
                        
                        <div className="flex justify-center items-center gap-4 mb-8">
                            <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 w-36 text-center">
                                <div className="text-slate-600 font-bold text-sm mb-1">Bacaan</div>
                                <div className="text-2xl font-black text-slate-800">{readingCombined} <span className="text-base font-normal text-slate-400">/ {maxReading}</span></div>
                            </div>
                            <div className="text-2xl text-slate-300 font-light">+</div>
                            <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 w-36 text-center">
                                <div className="text-slate-600 font-bold text-sm mb-1">Perbualan</div>
                                <div className="text-2xl font-black text-slate-800">{convTotal} <span className="text-base font-normal text-slate-400">/ {maxConv}</span></div>
                            </div>
                            <div className="text-2xl text-slate-300 font-light">=</div>
                            <div className={`border-4 rounded-2xl p-5 w-44 text-center shadow-sm ${syllabus === 'foundation' ? 'bg-emerald-50 border-emerald-200' : 'bg-blue-50 border-blue-200'}`}>
                                <div className={`font-bold text-sm mb-1 ${syllabus === 'foundation' ? 'text-emerald-700' : 'text-blue-700'}`}>Jumlah Markah</div>
                                <div className={`text-4xl font-black ${syllabus === 'foundation' ? 'text-emerald-800' : 'text-blue-800'}`}>{grandTotal} <span className={`text-lg ${syllabus === 'foundation' ? 'text-emerald-400' : 'text-blue-400'}`}>/ {maxTotal}</span></div>
                            </div>
                        </div>

                        <div className="mb-6">
                            <h2 className="text-xl font-black text-slate-900 mb-4 flex items-center">
                                <span className={`w-8 h-8 rounded-full flex items-center justify-center mr-3 text-lg ${syllabus === 'foundation' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>💡</span> 
                                Maklum Balas Guru:
                            </h2>
                            <div className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-6 text-lg text-slate-800 leading-loose font-medium text-justify whitespace-pre-wrap min-h-[150px]">
                                {feedbackText || "Guru belum melengkapkan penilaian."}
                            </div>
                        </div>
                        
                        <div className="text-center mt-10 text-slate-500 font-black text-lg tracking-widest">
                            Terus berusaha! Cikgu nantikan kejayaan kamu! 🚀
                        </div>
                    </div>

                    {/* Bahagian Rubrik Interaktif */}
                    <div className="no-print">
                        <div className="mb-12">
                            <h2 className={`text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm ${syllabus === 'foundation' ? 'border-emerald-500' : 'border-blue-600'}`}>
                                Bahagian 1: Bacaan Lantang ({isFoundation ? '15 markah [（Sebutan + Kelancaran）÷ 2]' : '20 markah'})
                            </h2>
                            {renderRubricRow('readingPron', currentRubrics.readingPron)}
                            {renderRubricRow('readingFluency', currentRubrics.readingFluency)}
                        </div>

                        <div className="mb-12">
                            <h2 className={`text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm ${syllabus === 'foundation' ? 'border-emerald-500' : 'border-green-500'}`}>
                                Bahagian 2: Perbualan ({maxConv} markah)
                            </h2>
                            {renderRubricRow('convResponse', currentRubrics.convResponse)}
                            {renderRubricRow('convLanguage', currentRubrics.convLanguage)}
                        </div>

                        {/* Bahagian Penyunting Maklum Balas */}
                        <div className={`mt-12 p-6 md:p-8 rounded-3xl border-2 shadow-sm ${syllabus === 'foundation' ? 'bg-emerald-50/50 border-emerald-100' : 'bg-blue-50/50 border-blue-100'}`}>
                            <h3 className={`font-black text-xl md:text-2xl mb-4 flex items-center ${syllabus === 'foundation' ? 'text-emerald-900' : 'text-blue-900'}`}>
                                📝 Pratinjau Maklum Balas Jana-Automatik 
                                <span className={`text-sm font-normal ml-3 px-3 py-1 rounded-full ${syllabus === 'foundation' ? 'text-emerald-600 bg-emerald-100' : 'text-blue-600 bg-blue-100'}`}>
                                    (Klik di dalam kotak teks untuk mengubah atau menambah nota secara bebas)
                                </span>
                            </h3>
                            <textarea 
                                className={`w-full h-48 md:h-64 p-6 rounded-2xl border-2 focus:ring-4 outline-none resize-none text-slate-800 text-lg leading-relaxed text-justify shadow-inner bg-white ${syllabus === 'foundation' ? 'border-emerald-200 focus:ring-emerald-500/20 focus:border-emerald-500' : 'border-blue-200 focus:ring-blue-500/20 focus:border-blue-500'}`}
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                placeholder="Klik pada jadual rubrik di atas untuk menjana maklum balas secara automatik. Anda juga boleh memasukkan nota khusus terus di sini..."
                            ></textarea>
                            
                            <div className="flex flex-col md:flex-row justify-between items-center mt-8 gap-4 pt-6 border-t border-slate-200/60">
                                <button 
                                    onClick={resetForm} 
                                    className="flex items-center text-slate-600 bg-white hover:bg-slate-100 border-2 border-slate-200 font-bold text-base px-6 py-3 rounded-xl transition-all order-2 md:order-1 shadow-sm"
                                >
                                    🔄 Kosongkan Borang 
                                </button>
                                
                                <div className="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 w-full md:w-auto order-1 md:order-2">
                                    <button 
                                        onClick={handleSavePDF}
                                        className="justify-center bg-white border-2 border-slate-300 hover:border-slate-400 text-slate-800 px-6 py-3 rounded-xl font-bold text-base shadow-sm flex items-center transition-all"
                                    >
                                        💾 Simpan PDF
                                    </button>
                                    <button 
                                        onClick={handleSubmitGAS}
                                        disabled={submitStatus === 'loading'}
                                        className={`justify-center text-white px-8 py-3 rounded-xl font-bold text-base shadow-md flex items-center transition-all transform hover:-translate-y-0.5 ${
                                            submitStatus === 'loading' 
                                            ? 'bg-indigo-400' 
                                            : (syllabus === 'foundation' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700')
                                        }`}
                                    >
                                        {submitStatus === 'loading' ? '☁️ Menghantar...' : '☁️ Hantar ke Cloud'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
